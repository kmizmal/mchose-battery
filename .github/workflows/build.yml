name: build

# 只做构建与打包，不创建 Release。发布由人工执行：
#   gh release create vX.Y.Z dist/MCHOSE_Battery_X.Y.rmskin
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 收紧权限：只需要读代码，明确不授予写权限，杜绝误发 Release
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    env:
      # 双保险：脚本内部已 reconfigure stdout，这里保证子进程也用 UTF-8
      PYTHONUTF8: "1"

    steps:
      # 运行时的版本要求不一致，别强行拉齐：
      #   checkout / setup-dotnet 从 v5 起就默认跑在 Node 24；
      #   upload-artifact 的 v5 只是「预备支持」，默认仍是 Node 20，
      #   要到 v6（runs.using: node24）才真正切换。
      # 三者都不满足时会报「Node.js 20 is deprecated」。
      # 最低 runner 版本：v5/v6 均要求 GitHub 托管 runner（≥ 2.327.1），本项目满足。
      - name: 检出源码
        uses: actions/checkout@v5

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          # 不启用 NuGet 缓存：本项目只用框架引用、没有任何 PackageReference，
          # 缓存目录根本不会生成，post 步骤反而会因路径不存在判失败。

      - name: 协议与状态机测试
        run: dotnet run --project tests/ProtocolTests -c Release

      - name: 构建插件（x64 + x86）
        run: python build_plugin.py --arch both

      - name: 打包 rmskin
        run: python build_package.py

      - name: 校验产物
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Format-Table Name, Length -AutoSize
          Get-ChildItem dist/plugin -File | Format-Table Name, Length -AutoSize
          $rmskin = Get-ChildItem dist -Filter *.rmskin
          if (-not $rmskin) { throw "没有生成 rmskin" }
          if ($rmskin.Length -lt 50KB) { throw "rmskin 体积异常：$($rmskin.Length) 字节" }
          # .rmskin 末尾必须有 16 字节 footer，key 为 "RMSKIN"
          $bytes = [IO.File]::ReadAllBytes($rmskin.FullName)
          $tail = [Text.Encoding]::ASCII.GetString($bytes, $bytes.Length - 7, 7)
          if ($tail -ne "RMSKIN") { throw "footer 校验失败：$tail" }
          "footer OK，大小 $($bytes.Length) 字节"

      - name: 上传构建产物
        uses: actions/upload-artifact@v6
        with:
          name: MCHOSE_Battery-rmskin
          path: |
            dist/*.rmskin
            dist/plugin/*.dll
          if-no-files-found: error
          retention-days: 30
