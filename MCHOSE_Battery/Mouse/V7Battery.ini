[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1
; 皮肤整体透明度固定为 #OpacityValue#（203/255 ≈ 80%），刷新时重新套用，
; 避免被 Rainmeter 记住的其他值带走。
OnRefreshAction=[!SetTransparency "#OpacityValue#"][!CommandMeasure MeasureV7 "Refresh"]

[Metadata]
Name=MCHOSE V7 电量
Author=WorkBuddy
Version=1.0
License=MIT
Information=迈从 MCHOSE V7 鼠标的电量与连接状态。左键点击卡片立即刷新，中键切换产品配色，鼠标移到进度条上会加粗。每 #RefreshMinutes# 分钟自动采集一次。

[Variables]
@Include=#@#Variables.inc
; =====================================================================
;  采集链路（C# 插件，无外部进程、无状态文件解析）
;    [MeasureV7] 是主实例：按 IntervalMinutes 在后台线程读 HID；
;    其余 Field=xxx 的实例只读同一份共享缓存，不重复采集。
; =====================================================================

[MeasureV7]
Measure=Plugin
Plugin=MCHOSE_Battery
Device=#DeviceMouse#
IntervalMinutes=#RefreshMinutes#
LowBattery=#LowBattery#
CriticalBattery=#CriticalBattery#
WindowMs=#TimeoutMs#
CacheFile=#@#v7-state.txt
Sound=#SoundOn#
Debug=0

[MeasureState]
Measure=Plugin
Plugin=MCHOSE_Battery
Device=#DeviceMouse#
Field=State

[MeasurePercent]
Measure=Plugin
Plugin=MCHOSE_Battery
Device=#DeviceMouse#
Field=Percent

[MeasurePercentText]
Measure=Plugin
Plugin=MCHOSE_Battery
Device=#DeviceMouse#
Field=PercentText

[MeasureCharging]
Measure=Plugin
Plugin=MCHOSE_Battery
Device=#DeviceMouse#
Field=Charging

[MeasureMode]
Measure=Plugin
Plugin=MCHOSE_Battery
Device=#DeviceMouse#
Field=Mode

[MeasureTheme]
Measure=Plugin
Plugin=MCHOSE_Battery
Device=#DeviceMouse#
Field=Theme

[MeasureUpdated]
Measure=Plugin
Plugin=MCHOSE_Battery
Device=#DeviceMouse#
Field=Updated
; =====================================================================
;  派生量
; =====================================================================
; 进度条填充宽度（Shape 用，像素）

[MeasureBarWidth]
Measure=Calc
Formula=(228 * [MeasurePercent] / 100)
MinValue=0
MaxValue=228
DynamicVariables=1
; 主题码：0 正常 / 1 掉线 / 2 异常 / 3 低电 / 4 极低电
; 暗色卡片上用的是一组提亮过的强调色，保证在深底上的对比度

[MeasureThemeNum]
Measure=Calc
Formula=[MeasureTheme]
DynamicVariables=1
IfCondition=(MeasureThemeNum = 0)
IfTrueAction=[!SetVariable Accent "78,160,255,255"][!SetVariable PillFg "150,196,255,255"][!SetVariable Dot "62,214,152,255"][!SetVariable PillBg "32,54,88,255"][!UpdateMeterGroup "Card"][!Redraw]
IfCondition2=(MeasureThemeNum = 1)
IfTrueAction2=[!SetVariable Accent "140,148,162,255"][!SetVariable PillFg "244,138,138,255"][!SetVariable Dot "242,96,96,255"][!SetVariable PillBg "62,34,36,255"][!UpdateMeterGroup "Card"][!Redraw]
IfCondition3=(MeasureThemeNum = 2)
IfTrueAction3=[!SetVariable Accent "242,96,96,255"][!SetVariable PillFg "248,132,132,255"][!SetVariable Dot "242,96,96,255"][!SetVariable PillBg "64,32,34,255"][!UpdateMeterGroup "Card"][!Redraw]
IfCondition4=(MeasureThemeNum = 3)
IfTrueAction4=[!SetVariable Accent "246,172,62,255"][!SetVariable PillFg "252,200,120,255"][!SetVariable Dot "246,172,62,255"][!SetVariable PillBg "66,50,24,255"][!UpdateMeterGroup "Card"][!Redraw]
IfCondition5=(MeasureThemeNum = 4)
IfTrueAction5=[!SetVariable Accent "246,84,84,255"][!SetVariable PillFg "252,116,116,255"][!SetVariable Dot "246,84,84,255"][!SetVariable PillBg "68,30,32,255"][!UpdateMeterGroup "Card"][!Redraw]
; =====================================================================
;  文案映射（中文只存在于本 .ini，编码为 UTF-16 LE）
; =====================================================================

[MeasurePillText]
Measure=String
String=[MeasureTheme]
RegExpSubstitute=1
Substitute="^0$":"已连接","^1$":"已断开","^2$":"异常","^3$":"电量偏低","^4$":"电量极低"
DynamicVariables=1

[MeasureModeText]
Measure=String
String=[MeasureMode]
RegExpSubstitute=1
Substitute="^0$":"2.4G 无线","^1$":"有线","^2$":"","^3$":"蓝牙"
DynamicVariables=1

[MeasureChargingText]
Measure=String
String=[MeasureCharging]
RegExpSubstitute=1
Substitute="^1$":"充电中","^[02]$":""
DynamicVariables=1

[MeasureDischargingText]
Measure=String
String=[MeasureCharging]
RegExpSubstitute=1
Substitute="^0$":"放电中","^[12]$":""
DynamicVariables=1

[MeasureUpdatedLabel]
Measure=String
String=[MeasureTheme]
RegExpSubstitute=1
Substitute="^0$":"更新","^[1234]$":"最后"
DynamicVariables=1

[MeasureOfflineTip]
Measure=String
String=[MeasureTheme]
RegExpSubstitute=1
Substitute="^1$":"唤醒鼠标后点击刷新","^2$":"读取异常，点击卡片重试","^[034]$":""
DynamicVariables=1
; 中键循环配色：white(0) -> black(1) -> red(2) -> pink(3)

[MeasureColorNext]
Measure=Calc
Formula=(#ColorIndex# + 1) % 4
DynamicVariables=1

[MeasureColorNextName]
Measure=Calc
Formula=(#ColorIndex# + 1) % 4
DynamicVariables=1
RegExpSubstitute=1
Substitute="^0$":"white","^1$":"black","^2$":"red","^3$":"pink"
; =====================================================================
;  外观（暗色）
; =====================================================================

[MeterCard]
Meter=Shape
Shape=Rectangle 2,3,260,136,12 | Fill Color 0,0,0,105 | StrokeWidth 0
Shape2=Rectangle 0,0,264,138,12 | Fill Color 24,26,32,255 | StrokeWidth 1 | Stroke Color 64,70,84,255
X=0
Y=0
LeftMouseUpAction=[!CommandMeasure MeasureV7 "Refresh"]
MiddleMouseUpAction=[!SetVariable Colorway "[MeasureColorNextName]"][!SetVariable ColorIndex "[MeasureColorNext:]"][!UpdateMeter MeterIcon][!Redraw]
; 左上角产品图：官方渲染图，按 #Colorway# 取对应配色的图标

[MeterIcon]
Meter=Image
ImageName=#@#Images\mouse-#Colorway#.png
X=14
Y=18
H=47
PreserveAspectRatio=1
DynamicVariables=1

[MeterTitle]
Meter=String
X=48
Y=16
FontFace=#FontFace#
FontSize=8.4
FontWeight=600
FontColor=134,142,158,255
AntiAlias=1
Text=MCHOSE  V7

[MeterPill]
Meter=Shape
Shape=Rectangle 0,0,78,19,9.5 | Fill Color #PillBg# | StrokeWidth 0
X=174
Y=12
DynamicVariables=1
Group=Card

[MeterDot]
Meter=Shape
Shape=Rectangle 0,0,5,5,2.5 | Fill Color #Dot# | StrokeWidth 0
X=185
Y=19
DynamicVariables=1
Group=Card

[MeterPillText]
Meter=String
MeasureName=MeasurePillText
X=214
Y=17
StringAlign=Center
FontFace=#FontFace#
FontSize=7.4
FontWeight=600
FontColor=#PillFg#
AntiAlias=1
DynamicVariables=1
Group=Card

[MeterDigits]
Meter=String
X=123
Y=30
StringAlign=Right
FontFace=#FontFace#
FontSize=37
FontWeight=700
FontColor=#Accent#
AntiAlias=1
Text=[MeasurePercentText]
DynamicVariables=1
Group=Card

[MeterUnit]
Meter=String
X=126
Y=53
FontFace=#FontFace#
FontSize=13
FontWeight=600
FontColor=#Accent#
AntiAlias=1
Text=%
DynamicVariables=1
Group=Card

[MeterMode]
Meter=String
MeasureName=MeasureModeText
X=157
Y=41
FontFace=#FontFace#
FontSize=8.8
FontColor=228,233,242,255
AntiAlias=1

[MeterCharging]
Meter=String
MeasureName=MeasureChargingText
X=157
Y=58
FontFace=#FontFace#
FontSize=7.4
FontColor=72,206,146,255
AntiAlias=1

[MeterDischarging]
Meter=String
MeasureName=MeasureDischargingText
X=157
Y=58
FontFace=#FontFace#
FontSize=7.4
FontColor=136,144,158,255
AntiAlias=1

[MeterOfflineTip]
Meter=String
MeasureName=MeasureOfflineTip
X=157
Y=58
FontFace=#FontFace#
FontSize=7.4
FontColor=#Accent#
AntiAlias=1
DynamicVariables=1
Group=Card
; 用 Shape 而不是 Bar：Bar 画不出圆角，加粗时两端会很生硬。
; 圆角半径取高度的一半，细看就是一根胶囊线。

[MeterBarTrack]
Meter=Shape
Shape=Rectangle 0,0,228,#BarH#,#BarR# | Fill Color 50,55,66,255 | StrokeWidth 0
X=18
Y=#BarY#
DynamicVariables=1
Group=Card

[MeterBarFill]
Meter=Shape
Shape=Rectangle 0,0,[MeasureBarWidth],#BarH#,#BarR# | Fill Color #Accent# | StrokeWidth 0
X=18
Y=#BarY#
DynamicVariables=1
Group=Card
; 一条 18px 高的透明感应带，给 3px 细线一个舒服的悬停/点击范围

[MeterBarZone]
Meter=Shape
Shape=Rectangle 0,0,244,16,0 | Fill Color 0,0,0,1 | StrokeWidth 0
X=10
Y=87
MouseOverAction=[!SetVariable BarH "8"][!SetVariable BarR "4"][!SetVariable BarY "94"][!UpdateMeterGroup "Card"][!Redraw]
MouseLeaveAction=[!SetVariable BarH "3"][!SetVariable BarR "1.5"][!SetVariable BarY "96"][!UpdateMeterGroup "Card"][!Redraw]
LeftMouseUpAction=[!CommandMeasure MeasureV7 "Refresh"]
MiddleMouseUpAction=[!SetVariable Colorway "[MeasureColorNextName]"][!SetVariable ColorIndex "[MeasureColorNext:]"][!UpdateMeter MeterIcon][!Redraw]

[MeterFooterLeft]
Meter=String
X=18
Y=114
FontFace=#FontFace#
FontSize=7
FontColor=124,132,146,255
AntiAlias=1
Text=[MeasureUpdatedLabel]  [MeasureUpdated]
DynamicVariables=1

[MeterFooterRight]
Meter=String
X=246
Y=114
StringAlign=Right
FontFace=#FontFace#
FontSize=7
FontColor=98,106,120,255
AntiAlias=1
Text=每 #RefreshMinutes# 分钟

